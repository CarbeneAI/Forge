name: Setup script tests

on:
  push:
  pull_request:
    paths:
      - README.md
      - CLAUDE.md
      - docs/QUICKSTART.md
      - ROADMAP.md
      - scripts/setup-new-machine.sh
      - scripts/pai-aliases.sh
      - tests/**
      - .github/workflows/setup-tests.yml

permissions:
  contents: read

jobs:
  setup-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Zsh on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh
      - name: Check shell syntax
        run: |
          bash -n scripts/setup-new-machine.sh
          bash -n scripts/pai-aliases.sh
          zsh -n scripts/pai-aliases.sh
      - name: Run isolated setup and Git helper fixtures
        run: python -m unittest discover -s tests -v
